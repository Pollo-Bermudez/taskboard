services:
  frontend:
    build: ./frontend
    environment:
      BACKEND_HOST: backend
      BACKEND_PORT: 3000
    ports:
      - "8080:8080"
    depends_on:
      - backend
    networks:
      - red-publica

  backend:
    build: ./backend
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-3000}
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: taskboard
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-15m}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-3}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SEED_USER_PASSWORD: ${SEED_USER_PASSWORD:-}
    ports:
      - "3001:3000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - red-publica
      - red-interna

  # Pruebas de API contra una base de datos temporal:
  #   docker compose --profile test run --rm backend-test
  backend-test:
    profiles: ["test"]
    build:
      context: ./backend
      target: test
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_ADMIN_NAME: taskboard
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      INIT_SQL_PATH: /db/init.sql
    volumes:
      - ./db/init.sql:/db/init.sql:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      - red-interna

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: taskboard
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d taskboard"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - red-interna

volumes:
  pgdata:

networks:
  red-publica:
  red-interna:
    internal: true
