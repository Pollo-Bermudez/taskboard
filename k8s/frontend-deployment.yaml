apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: taskboard
  labels:
    app: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: frontend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
      containers:
        - name: frontend
          image: taskboard/frontend:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            # NGINX sin root escucha en 8080 (DV-07); el Service expone 80.
            - name: http
              containerPort: 8080
          env:
            - name: BACKEND_HOST
              valueFrom:
                configMapKeyRef: { name: app-config, key: BACKEND_HOST }
            - name: BACKEND_PORT
              valueFrom:
                configMapKeyRef: { name: app-config, key: BACKEND_PORT }
            - name: API_BASE_URL
              valueFrom:
                configMapKeyRef: { name: app-config, key: API_BASE_URL }
          livenessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 2
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 200m, memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
