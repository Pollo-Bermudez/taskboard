# La StorageClass "standard" de Minikube usa reclaimPolicy Delete y es inmutable (DV-03).
# Esta clase usa el mismo aprovisionador pero conserva el volumen si se borra el PVC.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: standard-retain
provisioner: k8s.io/minikube-hostpath
reclaimPolicy: Retain
volumeBindingMode: Immediate
