# PLANTILLA. No aplicar con valores reales ni versionar el Secret real.
# Crear el Secret en el cluster con:
#   kubectl -n taskboard create secret generic db-credentials --from-env-file=.env.k8s
# (.env.k8s está en .gitignore; ver scripts/k8s-deploy.sh)
apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
  namespace: taskboard
type: Opaque
stringData:
  DB_USER: taskboard_user
  DB_PASSWORD: cambia_esta_contrasena
  JWT_SECRET: genera_con_openssl_rand_hex_32
  # Solo entornos de desarrollo/demostración; omitir en producción.
  SEED_USER_PASSWORD: TaskBoard-dev-2026
